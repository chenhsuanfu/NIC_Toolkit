name: Update GoodStock TWSE+TPEx Universe (Daily 100-Stock Backfill)

on:
  schedule:
    # Daily 03:00 Asia/Taipei (19:00 UTC) — completely separated from 16:30 TWSE Radar quota
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Refresh TWSE+TPEx prices & backfill 100 stocks 8Q financials
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GOODSTOCK_BATCH_SIZE: '100'
        run: python tools/goodstock/fetch_all_tw_stocks.py

      - name: Commit and push updated tw-universe-index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet tools/goodstock/tw-universe-index.json; then
            echo "No changes in tw-universe-index.json."
            exit 0
          fi
          git add tools/goodstock/tw-universe-index.json
          git commit -m "chore(goodstock): daily 100-stock 8Q financials backfill ($(date +'%Y-%m-%d'))"
          git push
