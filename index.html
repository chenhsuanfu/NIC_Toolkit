<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NIC工具集" />
  <title>NIC Toolkit | 個人財務與量化工具集</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./assets/css/main.css?v=45" />
  <script src="./core/app-meta.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-logo">NIC</div>
        <div>
          <div class="brand-title">NIC Toolkit</div>
          <div class="brand-sub">個人財務與量化平台</div>
        </div>
      </div>

      <nav class="nav-list" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div>Local-First 快取引擎 · <span id="app-version-label">v28</span></div>
        <div style="margin-top:2px;">US 綠漲紅跌 · 雙軌架構</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-sm" id="btn-sidebar-toggle" title="收合 / 展開導覽列" aria-label="切換導覽列">☰</button>
          <button class="btn btn-back btn-sm" id="btn-nav-back" hidden title="返回上一個畫面 (Alt + ←)">← 返回</button>
          <h1 class="page-title" id="topbar-title">工具集總覽</h1>
          <span class="mode-badge sandbox" id="topbar-mode-badge">本機沙盒</span>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="btn-theme-toggle" title="切換淺色 / 深色主題" aria-label="切換淺色或深色主題">
            ☀<span class="btn-label-desktop"> 淺色</span>
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-privacy-toggle" title="切換金額隱私遮罩">
            遮罩
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-quick-sync" title="檢視雲端同步狀態">
            同步(<span id="sync-count-badge">0</span>)
          </button>
          <div class="topbar-more-wrap">
            <button class="btn btn-ghost btn-sm" id="btn-topbar-more" title="更多操作與版本更新" aria-label="更多操作" aria-expanded="false">
              ⋯
            </button>
            <div class="topbar-more-menu" id="topbar-more-menu" hidden>
              <button type="button" class="btn btn-ghost topbar-more-item" id="btn-pwa-update" title="清除快取並更新版本（需點擊兩次確認）">
                🔄 強制更新 PWA (<span id="more-version-label">v57</span>)
              </button>
              <button type="button" class="btn btn-ghost topbar-more-item" id="btn-more-settings">
                ⚙ 設定與同步中心
              </button>
              <div class="topbar-more-meta" id="topbar-more-meta">
                模式：本機沙盒
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="view-container" id="app-view">
        <div class="card">正在載入資料...</div>
      </main>
    </div>

    <!-- Floating Quick Navigation Pill (Visible after scrolling down) -->
    <div class="floating-nav-pill" id="floating-nav-pill" aria-label="快速返回與回頂部">
      <button type="button" class="floating-pill-btn is-primary" id="btn-float-back" hidden title="返回上一個畫面">←</button>
      <button type="button" class="floating-pill-btn" id="btn-float-top" title="回到頂部">↑</button>
    </div>

    <!-- iPhone / Mobile Bottom Navigation -->
    <nav class="bottom-nav" id="mobile-nav"></nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    const APP_VERSION = window.NIC_APP_META?.version || 'v57';
    window.NIC_APP_VERSION = APP_VERSION;
    const versionLabelEl = document.getElementById('app-version-label');
    if (versionLabelEl) versionLabelEl.textContent = APP_VERSION;
    const moreVerEl = document.getElementById('more-version-label');
    if (moreVerEl) moreVerEl.textContent = APP_VERSION;
    const APP_VERSION_KEY = 'nic_toolkit_app_ver';
    const CORE_ASSETS = window.NIC_APP_META?.coreAssets || [];

    // Bypass GitHub Pages 10-min HTTP disk cache when upgrading app version
    if (localStorage.getItem(APP_VERSION_KEY) !== APP_VERSION) {
      await Promise.allSettled(CORE_ASSETS.map((u) => fetch(u, { cache: 'reload' })));
      localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
    }

    const [
      { store },
      { registry },
      { NavHistory, bindTwoStepConfirm },
      _agentBridgeMod,
      { HubUI },
      { StockTrackerUI },
      { GoodStockUI },
      { TwseRadarUI },
      { AssetTrackerUI },
      { SettingsUI }
    ] = await Promise.all([
      import('./core/store.js'),
      import('./core/registry.js'),
      import('./core/nav-history.js'),
      import('./core/agent-bridge.js'),
      import('./tools/hub/ui.js'),
      import('./tools/stock-tracker/ui.js'),
      import('./tools/goodstock/ui.js'),
      import('./tools/twse-radar/ui.js'),
      import('./tools/asset-tracker/ui.js'),
      import('./tools/settings/ui.js')
    ]);

    let currentToolId = 'hub';
    const navHistory = new NavHistory({ maxDepth: 30 });
    let historyCursor = 0;
    let isHandlingPopState = false;

    // Initialize Theme (Default: Dark, or user saved preference)
    const THEME_KEY = 'nic_toolkit_theme';
    function applyTheme(theme) {
      const isLight = theme === 'light';
      document.body.classList.toggle('theme-light', isLight);
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) {
        btn.innerHTML = isLight
          ? '🌙<span class="btn-label-desktop"> 深色</span>'
          : '☀<span class="btn-label-desktop"> 淺色</span>';
      }
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f8fafc' : '#0b1120');
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

    function showToast(msg) {
      const wrap = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function closeMoreMenu() {
      const menu = document.getElementById('topbar-more-menu');
      const moreBtn = document.getElementById('btn-topbar-more');
      if (menu) menu.hidden = true;
      if (moreBtn) moreBtn.setAttribute('aria-expanded', 'false');
    }

    function captureCurrentSnapshot() {
      const tool = registry.get(currentToolId);
      const fallbackLabel = tool ? (tool.shortName || tool.name) : currentToolId;
      let label = fallbackLabel;
      let viewState = null;
      if (tool?.ui && typeof tool.ui.getViewSnapshot === 'function') {
        try {
          const snap = tool.ui.getViewSnapshot();
          if (snap) {
            if (snap.label) label = snap.label;
            viewState = snap.state ?? null;
          }
        } catch (_) {}
      }
      return {
        toolId: currentToolId,
        label,
        viewState,
        scrollY: window.scrollY || document.documentElement.scrollTop || 0
      };
    }

    function updateBackControls() {
      const backBtn = document.getElementById('btn-nav-back');
      const floatBackBtn = document.getElementById('btn-float-back');
      const prev = navHistory.peek();
      if (prev) {
        if (backBtn) {
          backBtn.hidden = false;
          backBtn.textContent = `← ${prev.label}`;
          backBtn.title = `返回 ${prev.label} (Alt + ←)`;
        }
        if (floatBackBtn) {
          floatBackBtn.hidden = false;
          floatBackBtn.title = `返回 ${prev.label}`;
        }
      } else {
        if (backBtn) backBtn.hidden = true;
        if (floatBackBtn) floatBackBtn.hidden = true;
      }
    }

    function pushBrowserHistoryState(toolId) {
      try {
        historyCursor += 1;
        window.history.pushState({ nicNav: true, nicIdx: historyCursor, toolId }, '', `#${toolId}`);
      } catch (_) {
        window.location.hash = toolId;
      }
    }

    function restoreScrollPosition(y) {
      const targetY = Number.isFinite(Number(y)) ? Math.max(0, Number(y)) : 0;
      requestAnimationFrame(() => {
        try {
          window.scrollTo({ top: targetY, behavior: 'instant' });
        } catch (_) {
          window.scrollTo(0, targetY);
        }
      });
    }

    function navigateTo(toolId, options = {}) {
      if (!registry.get(toolId)) toolId = 'hub';
      const { onBeforeEnter, skipHistory = false, scrollY = 0 } = options || {};

      closeMoreMenu();
      document.body.classList.remove('sidebar-mobile-open');

      const isSameToolWithoutHook = toolId === currentToolId && typeof onBeforeEnter !== 'function';
      if (isSameToolWithoutHook && !skipHistory) {
        restoreScrollPosition(0);
        return;
      }

      if (!skipHistory) {
        const snap = captureCurrentSnapshot();
        const pushed = navHistory.push(snap);
        if (pushed) {
          pushBrowserHistoryState(toolId);
        }
      }

      currentToolId = toolId;
      const targetTool = registry.get(toolId);
      if (typeof onBeforeEnter === 'function' && targetTool?.ui) {
        try { onBeforeEnter(targetTool.ui); } catch (_) {}
      }

      renderShell();
      restoreScrollPosition(scrollY);
    }

    function pushIntraView(toolId, label, viewState) {
      const pushed = navHistory.push({
        toolId: toolId || currentToolId,
        label: label || registry.get(toolId || currentToolId)?.shortName || '上一頁',
        viewState: viewState ?? null,
        scrollY: window.scrollY || document.documentElement.scrollTop || 0
      });
      if (pushed) {
        pushBrowserHistoryState(toolId || currentToolId);
      }
      updateBackControls();
    }

    function applyGoBackFromStack() {
      const prev = navHistory.pop();
      if (!prev) {
        updateBackControls();
        return false;
      }
      closeMoreMenu();
      document.body.classList.remove('sidebar-mobile-open');
      currentToolId = registry.get(prev.toolId) ? prev.toolId : 'hub';
      const targetTool = registry.get(currentToolId);
      if (targetTool?.ui && typeof targetTool.ui.restoreViewSnapshot === 'function') {
        try { targetTool.ui.restoreViewSnapshot(prev.viewState); } catch (_) {}
      }
      renderShell();
      restoreScrollPosition(prev.scrollY);
      return true;
    }

    function goBack() {
      if (!navHistory.canGoBack()) return false;
      const st = window.history.state;
      if (st && st.nicNav && Number(st.nicIdx) > 0) {
        window.history.back();
        return true;
      }
      const ok = applyGoBackFromStack();
      try {
        window.history.replaceState({ nicNav: true, nicIdx: historyCursor, toolId: currentToolId }, '', `#${currentToolId}`);
      } catch (_) {}
      return ok;
    }

    // Register Modular Tools
    const hubInstance = new HubUI(navigateTo);
    const stockInstance = new StockTrackerUI();
    const goodstockInstance = new GoodStockUI();
    const twseRadarInstance = new TwseRadarUI();
    const assetInstance = new AssetTrackerUI();
    const settingsInstance = new SettingsUI();

    const openGoodStock = (code, subView = 'all') => {
      navigateTo('goodstock', {
        onBeforeEnter: (ui) => {
          if (code) ui.openStockInfo(code, subView);
        }
      });
    };

    const openStockDetail = (symbol, tab = 'holdings') => {
      navigateTo('stock-tracker', {
        onBeforeEnter: (ui) => {
          ui.activeTab = tab || 'holdings';
          if (symbol) {
            ui.selectedSymbol = symbol;
            ui.selectedLotId = null;
            ui.showBuyForSelected = false;
          }
        }
      });
    };

    const openAssetTab = (tab = 'accounts', filterAttr = null) => {
      navigateTo('asset-tracker', {
        onBeforeEnter: (ui) => {
          ui.activeTab = tab || 'accounts';
          if (filterAttr !== null) ui.filterAttr = filterAttr;
          ui.reconcilingKey = null;
        }
      });
    };

    window.NIC_OpenGoodStock = openGoodStock;
    window.NIC_Nav = {
      navigateTo,
      pushIntraView,
      goBack,
      canGoBack: () => navHistory.canGoBack(),
      syncBackUI: updateBackControls,
      openGoodStock,
      openStockDetail,
      openAssetTab
    };

    registry.register({
      id: 'hub',
      name: '工具集總覽',
      shortName: '總覽',
      icon: '◈',
      order: 1,
      ui: hubInstance
    });

    registry.register({
      id: 'stock-tracker',
      name: '股票庫存 (N_BD_C)',
      shortName: '股票庫存',
      icon: '▤',
      order: 2,
      ui: stockInstance
    });

    registry.register({
      id: 'goodstock',
      name: '好股價選股與健診',
      shortName: '好股價',
      icon: '◎',
      order: 3,
      ui: goodstockInstance
    });

    registry.register({
      id: 'twse-radar',
      name: 'TWSE 減碼行動雷達',
      shortName: '雷達',
      icon: '◉',
      order: 4,
      ui: twseRadarInstance
    });

    registry.register({
      id: 'asset-tracker',
      name: '家庭資產 (F&S)',
      shortName: '家庭資產',
      icon: '◫',
      order: 5,
      ui: assetInstance
    });

    registry.register({
      id: 'settings',
      name: '設定與同步中心',
      shortName: '設定',
      icon: '⚙',
      order: 6,
      ui: settingsInstance
    });

    function renderNavs() {
      const tools = registry.listAll();
      const sidebar = document.getElementById('sidebar-nav');
      const mobileNav = document.getElementById('mobile-nav');

      sidebar.innerHTML = tools.map((t) => `
        <button class="nav-item ${t.id === currentToolId ? 'active' : ''}" data-nav="${t.id}">
          <span class="nav-icon">${t.icon}</span>
          <span>${t.name}</span>
        </button>
      `).join('');

      mobileNav.innerHTML = tools.map((t) => `
        <button class="bottom-nav-item ${t.id === currentToolId ? 'active' : ''}" data-nav="${t.id}">
          <span class="bottom-nav-icon">${t.icon}</span>
          <span>${t.shortName}</span>
        </button>
      `).join('');

      document.querySelectorAll('[data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-nav')));
      });
    }

    function updateTopbar() {
      const tool = registry.get(currentToolId);
      const cfg = store.getConfig();
      const queue = store.getSyncQueue();
      const syncStatus = store.getSyncStatus();

      document.getElementById('topbar-title').textContent = tool ? tool.name : 'NIC Toolkit';

      const badge = document.getElementById('topbar-mode-badge');
      if (cfg.mode === 'cloud') {
        badge.className = 'mode-badge cloud';
        badge.textContent = '● 雲端同步';
      } else {
        badge.className = 'mode-badge sandbox';
        badge.textContent = '○ 本機沙盒';
      }

      const syncBtn = document.getElementById('btn-quick-sync');
      if (syncBtn) {
        if (syncStatus.state === 'syncing') {
          syncBtn.innerHTML = `同步中(<span id="sync-count-badge">${queue.length}</span>)`;
          syncBtn.title = '正在與 Google Sheets 背景同步';
        } else if (syncStatus.state === 'error') {
          syncBtn.innerHTML = `⚠ 同步異常(<span id="sync-count-badge">${queue.length}</span>)`;
          syncBtn.title = syncStatus.lastError || '雲端同步失敗，點擊檢視';
        } else {
          syncBtn.innerHTML = `同步(<span id="sync-count-badge">${queue.length}</span>)`;
          syncBtn.title = '檢視雲端同步狀態';
        }
      }

      const privBtn = document.getElementById('btn-privacy-toggle');
      if (cfg.privacyMask) {
        document.body.classList.add('privacy-masked');
        privBtn.textContent = '已遮罩';
      } else {
        document.body.classList.remove('privacy-masked');
        privBtn.textContent = '遮罩';
      }

      const moreMeta = document.getElementById('topbar-more-meta');
      if (moreMeta) {
        moreMeta.textContent = `版本 ${APP_VERSION} · ${cfg.mode === 'cloud' ? '雲端同步' : '本機沙盒'}`;
      }

      updateBackControls();
    }

    function renderShell() {
      renderNavs();
      updateTopbar();
      const tool = registry.get(currentToolId);
      const view = document.getElementById('app-view');
      if (tool && tool.ui) {
        try {
          tool.ui.render(view, store.getState(), store, showToast);
        } catch (err) {
          console.error(`Render error [${currentToolId}]:`, err);
          view.innerHTML = `<div class="card"><div class="card-title text-rose">畫面渲染發生錯誤 (${currentToolId})</div><p class="text-muted" style="margin-top:8px;">${err?.message || err}</p></div>`;
        }
      }
    }

    // Bind Topbar Actions
    const SIDEBAR_KEY = 'nic_toolkit_sidebar_collapsed';
    if (localStorage.getItem(SIDEBAR_KEY) === '1') {
      document.body.classList.add('sidebar-collapsed');
    }
    const sidebarToggleBtn = document.getElementById('btn-sidebar-toggle');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    if (sidebarToggleBtn) {
      sidebarToggleBtn.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
          document.body.classList.toggle('sidebar-mobile-open');
        } else {
          const collapsed = document.body.classList.toggle('sidebar-collapsed');
          localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
        }
      });
    }
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', () => {
        document.body.classList.remove('sidebar-mobile-open');
      });
    }

    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const next = document.body.classList.contains('theme-light') ? 'dark' : 'light';
      applyTheme(next);
      renderShell();
    });

    async function forceUpdatePWA(triggerBtn) {
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.textContent = '更新中...';
      }
      showToast('正在清除舊版快取並更新至最新版本...');
      try {
        localStorage.removeItem(APP_VERSION_KEY);
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        // Overwrite browser HTTP disk cache (max-age=600) for all core assets before reloading
        await Promise.allSettled(['./', './index.html', ...CORE_ASSETS].map((u) => fetch(u, { cache: 'reload' })));
        if (store.getConfig().mode === 'cloud' && store.getConfig().gasUrl) {
          await store.syncWithCloud({ forceRefresh: true, pushFirst: true, silent: true }).catch(() => {});
        }
      } catch (_) {}
      setTimeout(() => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('v', String(Date.now()));
        window.location.replace(nextUrl.toString());
      }, 300);
    }

    window.NIC_ForceUpdatePWA = forceUpdatePWA;

    const navBackBtn = document.getElementById('btn-nav-back');
    if (navBackBtn) {
      navBackBtn.addEventListener('click', () => goBack());
    }

    const floatBackBtn = document.getElementById('btn-float-back');
    if (floatBackBtn) {
      floatBackBtn.addEventListener('click', () => goBack());
    }

    const floatTopBtn = document.getElementById('btn-float-top');
    if (floatTopBtn) {
      floatTopBtn.addEventListener('click', () => {
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (_) {
          window.scrollTo(0, 0);
        }
      });
    }

    // Floating pill visibility on scroll (rAF throttled, passive listener)
    const floatingPill = document.getElementById('floating-nav-pill');
    if (floatingPill) {
      let scrollRaf = 0;
      const syncFloatPill = () => {
        scrollRaf = 0;
        const y = window.scrollY || document.documentElement.scrollTop || 0;
        floatingPill.classList.toggle('is-visible', y > 360);
      };
      window.addEventListener('scroll', () => {
        if (!scrollRaf) scrollRaf = requestAnimationFrame(syncFloatPill);
      }, { passive: true });
      syncFloatPill();
    }

    // Topbar More Menu (Overflow) + Two-step confirm for Force PWA Update
    const moreBtn = document.getElementById('btn-topbar-more');
    const moreMenu = document.getElementById('topbar-more-menu');
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const nextHidden = !moreMenu.hidden;
        moreMenu.hidden = nextHidden;
        moreBtn.setAttribute('aria-expanded', nextHidden ? 'false' : 'true');
      });
      document.addEventListener('click', (e) => {
        if (!moreMenu.hidden && !moreMenu.contains(e.target) && e.target !== moreBtn) {
          closeMoreMenu();
        }
      });
    }

    const moreSettingsBtn = document.getElementById('btn-more-settings');
    if (moreSettingsBtn) {
      moreSettingsBtn.addEventListener('click', () => {
        closeMoreMenu();
        navigateTo('settings');
      });
    }

    const pwaUpdateBtn = document.getElementById('btn-pwa-update');
    if (pwaUpdateBtn) {
      bindTwoStepConfirm(pwaUpdateBtn, {
        confirmText: '再點一次確認更新',
        timeoutMs: 3000,
        onConfirm: (e) => {
          closeMoreMenu();
          forceUpdatePWA(e.currentTarget);
        }
      });
    }

    document.getElementById('btn-privacy-toggle').addEventListener('click', () => {
      const cur = store.getConfig().privacyMask;
      store.saveConfig({ privacyMask: !cur });
      updateTopbar();
    });

    document.getElementById('btn-quick-sync').addEventListener('click', () => {
      navigateTo('settings');
    });

    // Global Keyboard Shortcuts: Alt+ArrowLeft (Back) & Escape (Close menus/panels/forms)
    document.addEventListener('keydown', (e) => {
      if (e.altKey && e.key === 'ArrowLeft') {
        if (navHistory.canGoBack()) {
          e.preventDefault();
          goBack();
        }
        return;
      }
      if (e.key === 'Escape') {
        if (moreMenu && !moreMenu.hidden) {
          closeMoreMenu();
          return;
        }
        if (document.body.classList.contains('sidebar-mobile-open')) {
          document.body.classList.remove('sidebar-mobile-open');
          return;
        }
        const tool = registry.get(currentToolId);
        if (tool?.ui && typeof tool.ui.handleEscape === 'function') {
          const handled = tool.ui.handleEscape();
          if (handled) {
            renderShell();
          }
        }
      }
    });

    // Browser / Mobile native back gesture integration
    window.addEventListener('popstate', (e) => {
      if (isHandlingPopState) return;
      isHandlingPopState = true;
      try {
        if (navHistory.canGoBack()) {
          applyGoBackFromStack();
          return;
        }
        const hashId = window.location.hash.replace('#', '');
        const nextId = (e.state && e.state.toolId && registry.get(e.state.toolId))
          ? e.state.toolId
          : (hashId && registry.get(hashId) ? hashId : 'hub');
        if (nextId !== currentToolId) {
          currentToolId = nextId;
          renderShell();
          restoreScrollPosition(0);
        }
      } finally {
        isHandlingPopState = false;
      }
    });

    // Initialize Local-First Store
    (async () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && registry.get(hash)) currentToolId = hash;
      try {
        window.history.replaceState({ nicNav: true, nicIdx: 0, toolId: currentToolId }, '', `#${currentToolId}`);
      } catch (_) {}

      await store.init();
      renderShell();

      // Subscribe to state/config/queue updates so background cloud sync refreshes UI seamlessly
      store.subscribe((_state, _cfg, _queue, reason) => {
        updateTopbar();
        const view = document.getElementById('app-view');
        const active = document.activeElement;
        const isEditingInView = Boolean(
          view && active && view.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)
        );
        const shouldRefreshView =
          reason === 'cloud-pull' ||
          reason === 'config' ||
          reason === 'reset' ||
          reason === 'init' ||
          currentToolId === 'settings';

        if (!shouldRefreshView) return;
        if (isEditingInView) {
          active.addEventListener('blur', () => renderShell(), { once: true });
          return;
        }
        renderShell();
      });

      // Cross-device auto-sync when tab/PWA returns to foreground or network reconnects
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          store.handleAppResume();
        }
      });
      window.addEventListener('online', () => {
        store.handleAppResume();
      });

      // Register PWA Service Worker & auto-refresh when a new SW version takes over
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update().catch(() => {});
        }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
