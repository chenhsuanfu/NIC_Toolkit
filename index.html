<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1120" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NIC工具集" />
  <title>NIC Toolkit | 個人財務與量化工具集</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./assets/css/main.css?v=12" />
</head>
<body>
  <div class="app-shell">
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-logo">NIC</div>
        <div>
          <div class="brand-title">NIC Toolkit</div>
          <div class="brand-sub">個人財務與量化平台</div>
        </div>
      </div>

      <nav class="nav-list" id="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div>Local-First 快取引擎 · <span id="app-version-label">v12</span></div>
        <div style="margin-top:2px;">US 綠漲紅跌 · 雙軌架構</div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="topbar-title">工具集總覽</h1>
          <span class="mode-badge sandbox" id="topbar-mode-badge">本機沙盒</span>
        </div>

        <div class="topbar-actions">
          <button class="btn btn-ghost btn-sm" id="btn-theme-toggle" title="切換淺色 / 深色主題">
            ☀ 淺色
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-privacy-toggle" title="切換金額隱私遮罩">
            遮罩
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-quick-sync" title="檢視雲端同步狀態">
            同步(<span id="sync-count-badge">0</span>)
          </button>
          <button class="btn btn-ghost btn-sm" id="btn-pwa-update" title="清除快取並更新版本">
            更新
          </button>
        </div>
      </header>

      <main class="view-container" id="app-view">
        <div class="card">正在載入資料...</div>
      </main>
    </div>

    <!-- iPhone / Mobile Bottom Navigation -->
    <nav class="bottom-nav" id="mobile-nav"></nav>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    const APP_VERSION = 'v12';
    const APP_VERSION_KEY = 'nic_toolkit_app_ver';
    const CORE_ASSETS = [
      './assets/css/main.css',
      './core/seed-data.js',
      './core/vault-data.js',
      './core/store.js',
      './core/api-client.js',
      './core/registry.js',
      './core/agent-bridge.js',
      './tools/hub/ui.js',
      './tools/stock-tracker/core.js',
      './tools/stock-tracker/ui.js',
      './tools/goodstock/data.js',
      './tools/goodstock/core.js',
      './tools/goodstock/ui.js',
      './tools/asset-tracker/data.js',
      './tools/asset-tracker/core.js',
      './tools/asset-tracker/ui.js',
      './tools/settings/ui.js'
    ];

    // Bypass GitHub Pages 10-min HTTP disk cache when upgrading app version
    if (localStorage.getItem(APP_VERSION_KEY) !== APP_VERSION) {
      await Promise.allSettled(CORE_ASSETS.map((u) => fetch(u, { cache: 'reload' })));
      localStorage.setItem(APP_VERSION_KEY, APP_VERSION);
    }

    const [
      { store },
      { registry },
      _agentBridgeMod,
      { HubUI },
      { StockTrackerUI },
      { GoodStockUI },
      { AssetTrackerUI },
      { SettingsUI }
    ] = await Promise.all([
      import('./core/store.js'),
      import('./core/registry.js'),
      import('./core/agent-bridge.js'),
      import('./tools/hub/ui.js'),
      import('./tools/stock-tracker/ui.js'),
      import('./tools/goodstock/ui.js'),
      import('./tools/asset-tracker/ui.js'),
      import('./tools/settings/ui.js')
    ]);

    let currentToolId = 'hub';

    // Initialize Theme (Default: Dark, or user saved preference)
    const THEME_KEY = 'nic_toolkit_theme';
    function applyTheme(theme) {
      const isLight = theme === 'light';
      document.body.classList.toggle('theme-light', isLight);
      const btn = document.getElementById('btn-theme-toggle');
      if (btn) btn.textContent = isLight ? '🌙 深色' : '☀ 淺色';
      const metaTheme = document.getElementById('meta-theme-color');
      if (metaTheme) metaTheme.setAttribute('content', isLight ? '#f8fafc' : '#0b1120');
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem(THEME_KEY) || 'dark');

    function showToast(msg) {
      const wrap = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }

    function navigateTo(toolId) {
      if (!registry.get(toolId)) toolId = 'hub';
      currentToolId = toolId;
      window.location.hash = toolId;
      renderShell();
    }

    // Register Modular Tools
    const hubInstance = new HubUI(navigateTo);
    const stockInstance = new StockTrackerUI();
    const goodstockInstance = new GoodStockUI();
    const assetInstance = new AssetTrackerUI();
    const settingsInstance = new SettingsUI();

    window.NIC_OpenGoodStock = (code, subView = 'all') => {
      if (code) goodstockInstance.openStockInfo(code, subView);
      navigateTo('goodstock');
    };

    registry.register({
      id: 'hub',
      name: '工具集總覽',
      shortName: '總覽',
      icon: '◈',
      order: 1,
      ui: hubInstance
    });

    registry.register({
      id: 'stock-tracker',
      name: '股票庫存 (N_BD_C)',
      shortName: '股票庫存',
      icon: '▤',
      order: 2,
      ui: stockInstance
    });

    registry.register({
      id: 'goodstock',
      name: '好股價選股與健診',
      shortName: '好股價',
      icon: '◎',
      order: 3,
      ui: goodstockInstance
    });

    registry.register({
      id: 'asset-tracker',
      name: '家庭資產 (F&S)',
      shortName: '家庭資產',
      icon: '◫',
      order: 4,
      ui: assetInstance
    });

    registry.register({
      id: 'settings',
      name: '設定與同步中心',
      shortName: '設定',
      icon: '⚙',
      order: 5,
      ui: settingsInstance
    });

    function renderNavs() {
      const tools = registry.listAll();
      const sidebar = document.getElementById('sidebar-nav');
      const mobileNav = document.getElementById('mobile-nav');

      sidebar.innerHTML = tools.map((t) => `
        <button class="nav-item ${t.id === currentToolId ? 'active' : ''}" data-nav="${t.id}">
          <span class="nav-icon">${t.icon}</span>
          <span>${t.name}</span>
        </button>
      `).join('');

      mobileNav.innerHTML = tools.map((t) => `
        <button class="bottom-nav-item ${t.id === currentToolId ? 'active' : ''}" data-nav="${t.id}">
          <span class="bottom-nav-icon">${t.icon}</span>
          <span>${t.shortName}</span>
        </button>
      `).join('');

      document.querySelectorAll('[data-nav]').forEach((btn) => {
        btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-nav')));
      });
    }

    function updateTopbar() {
      const tool = registry.get(currentToolId);
      const cfg = store.getConfig();
      const queue = store.getSyncQueue();

      document.getElementById('topbar-title').textContent = tool ? tool.name : 'NIC Toolkit';

      const badge = document.getElementById('topbar-mode-badge');
      if (cfg.mode === 'cloud') {
        badge.className = 'mode-badge cloud';
        badge.textContent = '● 雲端同步';
      } else {
        badge.className = 'mode-badge sandbox';
        badge.textContent = '○ 本機沙盒';
      }

      document.getElementById('sync-count-badge').textContent = String(queue.length);

      const privBtn = document.getElementById('btn-privacy-toggle');
      if (cfg.privacyMask) {
        document.body.classList.add('privacy-masked');
        privBtn.textContent = '已遮罩';
      } else {
        document.body.classList.remove('privacy-masked');
        privBtn.textContent = '遮罩';
      }
    }

    function renderShell() {
      renderNavs();
      updateTopbar();
      const tool = registry.get(currentToolId);
      const view = document.getElementById('app-view');
      if (tool && tool.ui) {
        tool.ui.render(view, store.getState(), store, showToast);
      }
    }

    // Bind Topbar Actions
    document.getElementById('btn-theme-toggle').addEventListener('click', () => {
      const next = document.body.classList.contains('theme-light') ? 'dark' : 'light';
      applyTheme(next);
      renderShell();
    });

    async function forceUpdatePWA(triggerBtn) {
      if (triggerBtn) {
        triggerBtn.disabled = true;
        triggerBtn.textContent = '更新中...';
      }
      showToast('正在清除舊版快取並更新至最新版本...');
      try {
        localStorage.removeItem(APP_VERSION_KEY);
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        // Overwrite browser HTTP disk cache (max-age=600) for all core assets before reloading
        await Promise.allSettled(['./', './index.html', ...CORE_ASSETS].map((u) => fetch(u, { cache: 'reload' })));
        if (store.getConfig().mode === 'cloud' && store.getConfig().gasUrl) {
          await store.pullFromCloudSilently(true).catch(() => {});
        }
      } catch (_) {}
      setTimeout(() => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('v', String(Date.now()));
        window.location.replace(nextUrl.toString());
      }, 300);
    }

    window.NIC_ForceUpdatePWA = forceUpdatePWA;

    document.getElementById('btn-pwa-update').addEventListener('click', (e) => {
      forceUpdatePWA(e.currentTarget);
    });

    document.getElementById('btn-privacy-toggle').addEventListener('click', () => {
      const cur = store.getConfig().privacyMask;
      store.saveConfig({ privacyMask: !cur });
      updateTopbar();
    });

    document.getElementById('btn-quick-sync').addEventListener('click', () => {
      navigateTo('settings');
    });

    // Initialize Local-First Store
    (async () => {
      const hash = window.location.hash.replace('#', '');
      if (hash && registry.get(hash)) currentToolId = hash;

      await store.init();
      renderShell();

      // Subscribe to state/config/queue updates so background cloud sync refreshes UI seamlessly
      store.subscribe(() => {
        renderShell();
      });

      // Register PWA Service Worker & auto-refresh when a new SW version takes over
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update().catch(() => {});
        }).catch(() => {});
      }
    })();
  </script>
</body>
</html>
